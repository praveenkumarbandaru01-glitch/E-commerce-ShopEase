
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 38px 32px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eeeaff;
            color: #764ba2;
            font-size: 30px;
            border-radius: 50%;
        }

        h2 {
            text-align: center;
            color: #292541;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            background: #fafafa;
            transition: 0.3s;
        }

        input:focus {
            border-color: #764ba2;
            background: white;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #764ba2;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }

        .messages {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 7px;
            background: #fff0f0;
            color: #c62828;
            font-size: 13px;
        }

        .errorlist {
            margin: 7px 0;
            padding-left: 18px;
            color: #c62828;
            font-size: 13px;
        }

        .signup-link {
            margin-top: 24px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        .signup-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }

            h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="icon">🔐</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue to your account</p>

        {% if messages %}
            {% for message in messages %}
                <div class="messages">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

       

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button class="login-btn" type="submit">
        Login
    </button>
</form>


        <p class="footer">
            &copy; 2026 My Account. All rights reserved.
        </p>

    </div>

    <script>
        function togglePassword() 
        {
            const passwordInput = document.getElementById('id_password');
            const toggleButton = document.querySelector('.toggle-password');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = 'Show';
            }
        }

    </script>

</body>
</html>
